<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    font-family:Arial, sans-serif;
}

.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.top,
.bottom{
    display:flex;
}

.logo,
.links,
.footer1,
.footer2{
    width:25rem;
    color:white;
    border:2px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo,
.links{
    height:4.5rem;
}

.main{
    width:50rem;
    height:25rem;
    border:2px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:2.5rem;
}

.box{
    width:9.2rem;
    height:9.2rem;
    background:dodgerblue;
    color:white;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0.6rem;
}

.footer1,
.footer2{
    height:4rem;
}
</style>
</head>

<body>

<section class="container">

    <section class="top">
        <section class="logo">Logo</section>
        <section class="links">Links</section>
    </section>

    <section class="main">
        <section class="box">Small Square Box</section>
        <section class="box">Small Square Box</section>
    </section>

    <section class="bottom">
        <section class="footer1">Footer1</section>
        <section class="footer2">Footer2</section>
    </section>

</section>

</body>
</html>
