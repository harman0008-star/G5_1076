<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background-color: black;
    }

    .main{
    display: grid;
    gap: 1rem;
    justify-content: center;
    align-content: center;
    height: 100vh;
}

#m1{
    grid-column: 1 / 3;
    justify-self: center;
}

#m2{
    grid-column: 1;
}

#m3{
    grid-column: 2;
}

#m4{
    grid-column: 1 / 3;
    justify-self: center;
}
@media (max-width: 768px){
  .box{
    width: 90%;
  }

    #m1,
    #m2,
    #m3,
    #m4{
        grid-column: 1;
        justify-content: center;
    }
}
    
    .box{
       
      width:14rem;
      height:8rem;
      background:dodgerblue;
      display:grid;
      justify-content:center;
      align-items:center;
      padding:1rem;

      
    }

    
  </style>
</head>

<body>

    <section class="main">
      <section class="box"  id="m1" style="border-radius: 10px;"></section>
      <section class="box"  id="m2" style="border-radius: 10px;"></section>
      <section class="box"  id="m3" style="border-radius: 10px;"></section>
      <section class="box"  id="m4" style="border-radius: 10px;"></section>
    </section>
    

</body>
</html
