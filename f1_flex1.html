<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 20px;
            background-color: white;
            color:white;
        }
        section{
            padding:20px;
        }
        .box{
            background-color: #1a1a1a;
        }
        .fc{
            display: flex; 
            gap:40px;
            flex-direction: row;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: center;
            align-items: flex-start;
            align-items: flex-end;
            align-items: center; 
        }
        .main{
            height: 200px;
            width:200px;
            padding:10px;
            border:2px solid black;
            box-shadow: 0px 0px 10px black;
            border-radius: 20px;
            background-color: rgb(2, 164, 2);
            color:black;
        }
        
    </style>
</head>
<body>
    
    <section class="box" style="height:10vh">Header/Navbar</section>
    <section class="fc" style="height: 80vh;background-color: whitesmoke;">    
    <main class="box main" >
        Main-1
    </main>
    <main class="box main">
        Main-2
    </main>
    </section>
    <section 
        class="box"
        style="position: absolute;bottom:0;left:0;height: 10vh;width:100%">
        Footer
        </section>
        <script></script>
   
</body>
</html>
