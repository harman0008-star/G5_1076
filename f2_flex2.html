<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>circles</title>
  <style>
    *{
      margin:10;
      padding:10;
      box-sizing: border-box;
    }
    .box {
    width: 200vh;
    height: 200px;
    border: 2px solid black;
    border-radius: 10px;
    background-color: white;
    display: flex;
    justify-content: center; 
    align-items: center;    
}
    .circle {
    width: 140px;
    height: 140px;
    
    border:2px solid black;
    justify-content: center;
    align-items: center;
    margin:10;
    border-radius: 50%;
}


  </style>
</head>
<body style="background-color: dodgerblue;">
  <section class="box" >
    <section class="circle" style="margin:-70px"></section>
    <section class="circle"></section>
    <section class="circle" style="margin:-70px"></section>

  </section>
</body>
</html>
