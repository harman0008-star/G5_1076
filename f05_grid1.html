<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>grid</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 20px;
            background-color: white;
            color:white;
        }
        section{
            padding:10px;
        }
        .box{
            background-color: rgb(26, 110, 143);
            color:white;
            padding:0.5rem;
        }
        .gc{
            display: grid;
            gap:0.5rem;

            grid-template-columns: 150px 250px;

            grid-template-rows: repeat(3,150px);

            place-content: center;
        }

            @media (min-width:767px){
                .gc{
                    grid-template-columns: 200px 200px 200px;

                    grid-template-rows: 200px 200px;
                }
            }
            @media (min-width:1024px){
                .gc{
                    grid-template-columns: repeat(4,250px);

                    grid-template-rows: repeat(2,250px);
                }
                #m6{
                    grid-column: 2/-1;
                }
            }
            
                
            
    </style>
</head>
<body>
    <section class="box" style="height:10vh;">Header/Navbar</section>
    <section 
    class ="box gc"
    style="height:80vh; background-color: white;">
    <main class="box" id="m1">Content-1</main>
    <main class="box" id="m2">Content-2</main>
    <main class="box" id="m3">Content-3</main>
    <main class="box" id="m4">Content-4</main>
    <main class="box" id="m5">Content-5</main>
    <main class="box" id="m6">Content-6</main>
    
    </section>
        <section 
        class="box"
        style="position: absolute; bottom:0; left:0; height: 10vh; width:100%">
        Footer
        </section>
        <script></script>
   
</body>
</html>
