<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            min-height: 100dvh;
            background-image:url('https://wallpapercave.com/wp/wp5018679.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .p{
            padding:0.5rem;
        }

        section{
            width:100%;
        }
        .box{
            width:100%;
            height:7rem;
            border:1px solid white;
            border-radius: 5px;
            overflow:hidden;
        }
        .card{
            padding:0.5rem;
             width:100%;
            height:9rem;
            border:1px solid white;
            border-radius: 5px;
            overflow:hidden;
            box-shadow: 0 3px 5px black;
            border : 1px solid skyblue;
            background-color: blur(10px);
            backdrop-filter: blur(5px);
            color:white;
            max-width:500px;

        }
        .fc1{
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap:0.5rem;
        }
        .fc2{
            display:flex;
            flex-direction: row;
            justify-content: center;
            gap:0.5rem;
        }
        @media screen and (min-width:767px){
            #s1,
            #s2{
                width:80%;
            }
        }
        @media screen and (min-width:1024px){
            #s1,
            #s2{
                width:70%;
            }
        }

    </style>
</head>
<body>
    <section class="p fc1">
        <section class="fc2" id="s1">
            <div class="card">Box 1</div>

        </section>
        <section class="fc2" id="s2">
            <div class="card">Box 2</div>
            <div class="card">Box 3</div>
            <div class="card">Box 4</div>

        </section>

    </section>
    
</body>
</html>
