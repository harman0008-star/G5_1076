<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background-color: black;
    }

    .container{
      display:grid;
      grid-template-columns: 25rem 25rem;   
      grid-template-rows: 4.5rem 25rem 4rem;
      height:100vh;
      justify-content:center;  
      align-content: center; 
    }

    .logo,
    .links,
    .main,
    .footer1,
    .footer2{
      border:1px solid white;
      background:black;
      color:white;
    }

    .logo{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .links{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .main{
    grid-column-start:1;
    grid-column-end:3;
    display:grid;
    justify-items:center;
    align-content:center;
    gap:1.5rem;
}

    .box{
      width:15rem;
      height:9rem;
      background:#1e90ff;
      display:grid;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:0.6rem;
      border-radius: 5px;
      
    }

    .footer1,
    .footer2{
      display:flex;
      align-items:center;
      justify-content:center;
    }
  </style>
</head>

<body>

  <section class="container" >

    <section class="logo">Logo</section>

    <section class="links">Links</section>

    <section class="main" >
      <section class="box">Rectangle 1</section>
      <section class="box">Rectangle 2</section>
    </section>

    <section class="footer1">Footer1</section>

    <section class="footer2">Footer2</section>

  </section>

</body>
</html
